<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>Dota Draft AI — Counter & Meta</title>

<style>
:root{
  --bg:#090b10;
  --panel:#11151d;
  --panel2:#171c26;
  --panel3:#1d2430;
  --border:#2a3342;
  --text:#f2f5f9;
  --muted:#8f9aaa;
  --green:#42d392;
  --red:#ff6677;
  --yellow:#f2c94c;
  --blue:#61a8ff;
  --purple:#a78bfa;
  --shadow:0 12px 35px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "SF Pro Text",Inter,Arial,sans-serif;
  min-height:100%;
}

body{
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
}

a{
  color:inherit;
  text-decoration:none;
}

.app{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:14px 12px 30px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.logo{
  font-weight:900;
  font-size:20px;
  letter-spacing:-.5px;
}

.status{
  font-size:11px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:6px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--yellow);
}

.dot.ok{
  background:var(--green);
}

.dot.bad{
  background:var(--red);
}

.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:12px;
}

.tab{
  min-height:42px;
  border-radius:12px;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

.tab.active{
  color:var(--text);
  background:var(--panel2);
  border-color:#3a4658;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  box-shadow:var(--shadow);
  padding:12px;
  margin-bottom:10px;
}

.section-title{
  font-size:15px;
  font-weight:900;
  margin-bottom:10px;
}

.sub{
  font-size:11px;
  color:var(--muted);
  line-height:1.45;
}

.source-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.badge{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:0 8px;
  border-radius:8px;
  background:var(--panel3);
  color:#b7c1cf;
  font-size:10px;
  font-weight:800;
}

.badge.green{
  color:#7ff0b9;
}

.badge.yellow{
  color:#f5d66c;
}

.badge.red{
  color:#ff8794;
}

.team-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.team-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.team-title strong{
  font-size:13px;
}

.role-list{
  display:grid;
  gap:7px;
}

.role-slot{
  position:relative;
  min-height:61px;
  border-radius:13px;
  border:1px dashed #354153;
  background:#0e1219;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  cursor:pointer;
}

.role-slot.filled{
  border-style:solid;
  border-color:#3a4658;
  background:#151a23;
}

.role-slot img{
  width:48px;
  height:48px;
  border-radius:9px;
  object-fit:cover;
  background:#202734;
  flex:none;
}

.role-empty{
  color:#697486;
  font-size:11px;
  line-height:1.25;
}

.role-name{
  font-size:10px;
  color:var(--muted);
  margin-bottom:2px;
}

.hero-name{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.remove{
  position:absolute;
  right:5px;
  top:5px;
  width:27px;
  height:27px;
  border-radius:9px;
  background:rgba(255,255,255,.08);
  color:#c5ced9;
  font-weight:900;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.btn{
  min-height:44px;
  border-radius:12px;
  background:var(--panel2);
  border:1px solid var(--border);
  font-size:12px;
  font-weight:900;
}

.btn.primary{
  background:var(--green);
  color:#07140d;
  border-color:transparent;
}

.btn:disabled{
  opacity:.35;
}

.search-box{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.search-box input{
  width:100%;
  min-height:44px;
  border-radius:12px;
  border:1px solid var(--border);
  outline:0;
  background:#0c1017;
  color:var(--text);
  padding:0 13px;
}

.hero-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  max-height:62vh;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

.hero-pick{
  min-width:0;
  border:1px solid #293342;
  background:#121721;
  border-radius:11px;
  padding:5px;
  text-align:left;
}

.hero-pick img{
  width:100%;
  aspect-ratio:1.45;
  object-fit:cover;
  border-radius:8px;
  background:#202734;
}

.hero-pick .pick-name{
  font-size:9px;
  font-weight:800;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.hero-pick .pick-role{
  font-size:8px;
  color:var(--muted);
  margin-top:2px;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(4,6,9,.94);
  display:none;
  padding:
    max(12px,env(safe-area-inset-top))
    10px
    max(12px,env(safe-area-inset-bottom));
}

.overlay.show{
  display:flex;
  flex-direction:column;
}

.overlay-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

.overlay-head strong{
  flex:1;
  font-size:15px;
}

.close{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--panel2);
  border:1px solid var(--border);
  font-size:20px;
}

.picker-filter{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:9px;
}

.filter{
  flex:none;
  padding:8px 10px;
  border-radius:9px;
  background:var(--panel2);
  color:var(--muted);
  border:1px solid var(--border);
  font-size:10px;
  font-weight:800;
}

.filter.active{
  color:var(--text);
  border-color:#52627a;
}

.overlay .hero-grid{
  flex:1;
  max-height:none;
}

.counter-search{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}

.counter-search input{
  min-height:46px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#0c1017;
  color:var(--text);
  outline:0;
  padding:0 12px;
}

.counter-search button{
  min-width:90px;
  border-radius:12px;
  background:var(--green);
  color:#07140d;
  font-size:11px;
  font-weight:900;
}

.target-card{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.target-card img{
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:11px;
}

.results{
  display:grid;
  gap:7px;
  margin-top:10px;
}

.counter-item{
  display:grid;
  grid-template-columns:50px 1fr auto;
  gap:9px;
  align-items:center;
  padding:8px;
  border-radius:13px;
  background:#121721;
  border:1px solid #293342;
}

.counter-item img{
  width:50px;
  height:42px;
  border-radius:8px;
  object-fit:cover;
}

.counter-main{
  min-width:0;
}

.counter-name{
  font-size:12px;
  font-weight:900;
}

.counter-meta{
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
}

.adv{
  font-size:13px;
  font-weight:900;
  color:var(--green);
  text-align:right;
}

.win{
  color:#aeb8c5;
  font-size:9px;
  margin-top:3px;
  text-align:right;
}

.recommendations{
  display:grid;
  gap:8px;
}

.rec{
  display:grid;
  grid-template-columns:58px 1fr auto;
  gap:9px;
  align-items:center;
  padding:8px;
  background:#121721;
  border:1px solid #293342;
  border-radius:14px;
}

.rec img{
  width:58px;
  height:48px;
  border-radius:9px;
  object-fit:cover;
}

.rec-name{
  font-size:13px;
  font-weight:900;
}

.rec-role{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}

.rec-reasons{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:5px;
}

.reason{
  padding:3px 5px;
  border-radius:6px;
  background:#202835;
  color:#aeb9c7;
  font-size:8px;
  font-weight:800;
}

.reason.counter{
  color:#79e8ad;
}

.reason.bad{
  color:#ff8593;
}

.rec-score{
  text-align:right;
}

.rec-score strong{
  display:block;
  font-size:16px;
}

.rec-score span{
  color:var(--muted);
  font-size:8px;
}

.rec-pick{
  margin-top:5px;
  min-height:31px;
  padding:0 8px;
  border-radius:8px;
  background:var(--green);
  color:#07140d;
  font-size:9px;
  font-weight:900;
}

.matrix-wrap{
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

.matrix{
  border-collapse:separate;
  border-spacing:3px;
  min-width:620px;
  width:100%;
}

.matrix th,
.matrix td{
  min-width:70px;
  height:52px;
  border-radius:8px;
  background:#121721;
  text-align:center;
  font-size:9px;
}

.matrix th{
  background:#1a202b;
  font-weight:900;
}

.matrix .hero-head{
  min-width:100px;
}

.matrix img{
  width:35px;
  height:27px;
  border-radius:5px;
  object-fit:cover;
  display:block;
  margin:0 auto 3px;
}

.plus{
  color:var(--green);
  font-weight:900;
}

.minus{
  color:var(--red);
  font-weight:900;
}

.neutral{
  color:#687486;
}

.synergy{
  color:var(--blue);
  font-weight:900;
}

.analysis-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat-box{
  background:#121721;
  border:1px solid #293342;
  border-radius:13px;
  padding:10px;
}

.stat-label{
  color:var(--muted);
  font-size:9px;
}

.stat-value{
  margin-top:4px;
  font-size:18px;
  font-weight:900;
}

.danger{
  border-left:3px solid var(--red);
  padding-left:9px;
  margin:8px 0;
}

.good{
  border-left:3px solid var(--green);
  padding-left:9px;
  margin:8px 0;
}

.meta-tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:10px;
}

.meta-tab{
  flex:none;
  padding:8px 11px;
  border-radius:9px;
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--muted);
  font-size:10px;
  font-weight:900;
}

.meta-tab.active{
  color:var(--text);
  border-color:#53637b;
}

.meta-list{
  display:grid;
  gap:7px;
}

.meta-item{
  display:grid;
  grid-template-columns:45px 1fr auto;
  gap:8px;
  align-items:center;
  background:#121721;
  border:1px solid #293342;
  border-radius:12px;
  padding:7px;
}

.meta-item img{
  width:45px;
  height:37px;
  object-fit:cover;
  border-radius:7px;
}

.meta-name{
  font-size:11px;
  font-weight:900;
}

.meta-sub{
  font-size:8px;
  color:var(--muted);
  margin-top:3px;
}

.meta-rating{
  text-align:right;
  font-size:14px;
  font-weight:900;
}

.meta-rating small{
  display:block;
  color:var(--muted);
  font-size:8px;
  font-weight:700;
}

.footer{
  text-align:center;
  padding:18px 5px 8px;
  color:#697486;
  font-size:10px;
}

.footer a{
  color:#8fb9ff;
  font-weight:900;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  z-index:300;
  max-width:90%;
  padding:10px 14px;
  border-radius:11px;
  background:#202733;
  border:1px solid #394557;
  box-shadow:var(--shadow);
  font-size:11px;
  font-weight:800;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:80;
  background:rgba(10,13,18,.94);
  backdrop-filter:blur(16px);
  border-top:1px solid #252e3a;
  padding:7px 8px max(7px,env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.bottom-nav button{
  min-height:46px;
  border-radius:10px;
  background:transparent;
  color:#778293;
  font-size:9px;
  font-weight:900;
}

.bottom-nav button.active{
  color:var(--text);
  background:#181e28;
}

.loading{
  padding:16px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}

.empty{
  padding:16px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}

@media(min-width:650px){
  .hero-grid{
    grid-template-columns:repeat(6,1fr);
  }
}

@media(max-width:420px){
  .team-grid{
    grid-template-columns:1fr;
  }

  .hero-grid{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <div class="logo">DOTA DRAFT AI</div>
    <div class="sub">7.41e · Counter / Synergy / Meta</div>
  </div>

  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">загрузка героев…</span>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="draft">Драфт</button>
  <button class="tab" data-tab="counters">Контрпики</button>
  <button class="tab" data-tab="meta">Мета</button>
  <button class="tab" data-tab="analysis">Разбор</button>
</div>

<main id="content"></main>

<div class="footer">
  <div>Источники: D2PT 7k+ · Dotabuff · OpenDota fallback</div>
  <div style="margin-top:7px">
    <a href="https://t.me/painiso" target="_blank" rel="noopener">
      Telegram @painiso
    </a>
  </div>
</div>

</div>

<div class="bottom-nav">
  <button data-tab="draft" class="active">⚔️<br>Драфт</button>
  <button data-tab="counters">🎯<br>Контры</button>
  <button data-tab="meta">📊<br>Мета</button>
  <button data-tab="analysis">🧠<br>Разбор</button>
</div>

<div class="overlay" id="picker">
  <div class="overlay-head">
    <strong id="pickerTitle">Выбрать героя</strong>
    <button class="close" id="closePicker">×</button>
  </div>

  <div class="search-box">
    <input id="heroSearch" autocomplete="off" placeholder="Поиск героя…">
  </div>

  <div class="picker-filter">
    <button class="filter active" data-filter="all">Все</button>
    <button class="filter" data-filter="carry">Carry</button>
    <button class="filter" data-filter="mid">Mid</button>
    <button class="filter" data-filter="offlane">Offlane</button>
    <button class="filter" data-filter="support">Support</button>
    <button class="filter" data-filter="hard">Hard support</button>
  </div>

  <div class="hero-grid" id="pickerGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   DOTA DRAFT AI
   Полная логика:
   - полный пул героев
   - быстрый picker
   - свежий Dotabuff Counter Finder
   - counter-aware draft recommendations
   - role-aware recommendations
   - synergy matrix
   - progressive matchup matrix
   - localStorage cache
========================================================= */

const APP_VERSION = "4.0.0-counter-first";
const PATCH = "7.41e";

const HERO_SOURCE =
  "https://raw.githubusercontent.com/odota/dotaconstants/master/build/heroes.json";

const OPENDOTA_HEROES =
  "https://api.opendota.com/api/heroStats";

const DOTABUFF_BASE =
  "https://www.dotabuff.com/heroes/";

const CACHE_TTL = 15 * 60 * 1000;
const META_TTL = 60 * 60 * 1000;

  currentTab: "draft",

  pickerSide: null,
  pickerIndex: null,

  counters: {},

  analysis: null

const ROLE_NAMES = [
  "pos1",

  "pos5"

const ROLE_LABELS = {
  pos1:"Carry",
  pos2:"Mid",
  pos3:"Offlane",
  pos4:"Support",
  pos5:"Hard support"

/* ---------------------------------------------------------
   D2PT snapshot / fallback role intelligence.
   Это не единственный фактор.
--------------------------------------------------------- */

  pos4: [

  pos5: [

/* ---------------------------------------------------------
   Текущие известные matchup hints.
   Это ТОЛЬКО быстрый fallback, пока Dotabuff загружается.
   Основной источник — свежий Dotabuff.
--------------------------------------------------------- */

const KNOWN_COUNTERS = {

  puck: [
    ["night_stalker",5.39],

/* ---------------------------------------------------------
   Utility
--------------------------------------------------------- */

function slugify(value){
  return String(value || "")
    .toLowerCase()
    .replace(/['’]/g,"")
    .replace(/[^a-z0-9]+/g,"_")
    .replace(/^_+|_+$/g,"");
}

function displayName(hero){
  return hero?.localized_name ||
         hero?.name?.replace("npc_dota_hero_","") ||
         "Unknown";
}

function heroKey(hero){
  return hero?.key || slugify(displayName(hero));
}

function normalizeText(value){
  return slugify(
    String(value || "")
      .replace(/&nbsp;/g," ")
      .replace(/<[^>]+>/g," ")
  );
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

function toast(text){
  const el=document.getElementById("toast");
  el.textContent=text;
  el.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>el.classList.remove("show"),2300);
}

function setStatus(text,type=""){
  document.getElementById("statusText").textContent=text;
  const dot=document.getElementById("statusDot");
  dot.className="dot "+(type || "");
}

function cacheKey(key){
  return `${APP_VERSION}:${key}`;
}

function readCache(key,ttl){
  try{
    const raw=localStorage.getItem(cacheKey(key));
    if(!raw) return null;

    const data=JSON.parse(raw);

    if(Date.now()-data.time > ttl){
      return null;
    }

    return data.value;
  }catch{
    return null;
  }
}

function writeCache(key,value){
  try{
    localStorage.setItem(
      cacheKey(key),
      JSON.stringify({
        time:Date.now(),
        value
      })
    );
  }catch{}
}

/* ---------------------------------------------------------
   Fetch with timeout
--------------------------------------------------------- */

async function fetchText(url,timeout=3500){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);

  try{
    const res=await fetch(url,{
      signal:controller.signal,
      cache:"no-store",
      headers:{
        "Accept":"text/html,text/plain,application/json,*/*"
      }
    });

    if(!res.ok){
      throw new Error("HTTP "+res.status);
    }

    return await res.text();
  }finally{
    clearTimeout(timer);
  }
}

async function fetchJSON(url,timeout=4000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);

  try{
    const res=await fetch(url,{
      signal:controller.signal,
      cache:"no-store",
      headers:{
        "Accept":"application/json"
      }
    });

    if(!res.ok){
      throw new Error("HTTP "+res.status);
    }

    return await res.json();
  }finally{
    clearTimeout(timer);
  }
}

async function loadHeroes(){

  let raw = readCache("heroes",24*60*60*1000);

  if(raw){
    state.heroes=raw;
    indexHeroes();

  try{
    const data=await fetchJSON(HERO_SOURCE,6000);

    state.heroes=Object.values(data)
      .filter(h=>h && h.id && h.localized_name)
      .map(h=>({
        id:Number(h.id),
        key:slugify(h.localized_name),
        localized_name:h.localized_name,
        name:h.name,
        roles:Array.isArray(h.roles)?h.roles:[],
        primary_attr:h.primary_attr,
        img:h.img,
        icon:h.icon
      }));

    writeCache("heroes",state.heroes);
    indexHeroes();

    setStatus(`${state.heroes.length} героев`,"ok");
    return;

  }catch(e){
    console.warn("GitHub hero source failed",e);
  }

  try{
    const data=await fetchJSON(OPENDOTA_HEROES,6000);

    state.heroes=data
      .filter(h=>h && h.id && h.localized_name)
      .map(h=>({
        id:Number(h.id),
        key:slugify(h.localized_name),
        localized_name:h.localized_name,
        name:h.name,
        roles:Array.isArray(h.roles)?h.roles:[],
        primary_attr:h.primary_attr,

        icon:h.icon
      }));

    writeCache("heroes",state.heroes);
    indexHeroes();

    setStatus(`${state.heroes.length} героев`,"ok");

  }catch(e){

function indexHeroes(){
  state.heroesById={};
  state.heroesByName={};

  for(const hero of state.heroes){
    state.heroesById[hero.id]=hero;
    state.heroesByName[heroKey(hero)]=hero;
    state.heroesByName[slugify(hero.localized_name)]=hero;
  }
}

/* ---------------------------------------------------------
   Role intelligence
--------------------------------------------------------- */

function getMetaEntry(hero,role){
  const key=heroKey(hero);

  const list=META_SNAPSHOT[role] || [];
  const found=list.find(x=>x[0]===key);

  if(found){
    return {
      rating:found[1],
      winRate:found[2],
      matches:found[3],
      source:"D2PT snapshot"
    };
  }

  if(state.meta[role]?.[key]){
    return state.meta[role][key];
  }

  return null;
}

function roleFit(hero,role){
  const entry=getMetaEntry(hero,role);

  if(entry){
    return clamp(
      45 + (entry.rating-45)*1.1,
      25,
      100
    );
  }

  const roles=hero.roles || [];

  const wanted={
    pos1:["Carry"],
    pos2:["Nuker","Escape"],
    pos3:["Durable","Initiator","Disabler"],
    pos4:["Support","Disabler","Nuker"],
    pos5:["Support","Disabler"]
  }[role] || [];

  let score=22;

  for(const r of wanted){
    if(roles.includes(r)){
      score+=10;
    }
  }

  return clamp(score,15,65);
}

function knownCountersFor(targetHero){
  const key=heroKey(targetHero);
  return (KNOWN_COUNTERS[key] || [])
    .map(([heroKeyValue,adv])=>{
      const hero=state.heroesByName[heroKeyValue];
      if(!hero) return null;

      return {
        heroId:hero.id,
        advantage:Number(adv),
        heroWinRate:null,
        matches:null,
        source:"fallback"
      };
    })
    .filter(Boolean);
}

    anti_mage:"anti-mage",
    keeper_of_the_light:"keeper-of-the-light",

    spirit_breaker:"spirit-breaker",
    night_stalker:"night-stalker",
    ancient_apparition:"ancient-apparition",
    centaur_warrunner:"centaur-warrunner",
    dark_seer:"dark-seer",
    death_prophet:"death-prophet",
    lone_druid:"lone-druid",
    templar_assassin:"templar-assassin",
    treant_protector:"treant-protector",

  };

}

function cleanHtmlText(text){
  return String(text || "")
    .replace(/<script[\s\S]*?<\/script>/gi," ")
    .replace(/<style[\s\S]*?<\/style>/gi," ")
    .replace(/<[^>]+>/g," ")
    .replace(/&nbsp;/gi," ")
    .replace(/&amp;/gi,"&")
    .replace(/&#39;|&#x27;/gi,"'")
    .replace(/&quot;/gi,'"')
    .replace(/\s+/g," ")
    .trim();
}

function parsePercent(text){
  const m=String(text).match(/-?\d+(?:\.\d+)?\s*%/);
  return m ? Number(m[0].replace("%","")) : null;
}

function parseNumber(text){
  const m=String(text).replace(/,/g,"").match(/\b\d{2,}\b/);
  return m ? Number(m[0]) : null;
}

function findHeroByText(text){
  const normalized=normalizeText(text);

  if(state.heroesByName[normalized]){
    return state.heroesByName[normalized];
  }

  let best=null;

  for(const hero of state.heroes){
    const names=[
      hero.localized_name,
      displayName(hero),
      heroKey(hero)
    ];

    for(const name of names){
      const n=normalizeText(name);

      if(normalized===n){
        return hero;
      }

      if(normalized.includes(n) && n.length>=4){
        best=hero;
      }
    }
  }

  return best;
}

function parseDotabuffCounters(html,targetHero){

  const result=[];

  /* 
     Dotabuff page has tables:
     "Hero / Disadvantage / Hero Win Rate"
     and
     "Hero / Advantage / Hero Win Rate"

     We only need the first table for:
     "target is countered by candidate".
  */

  const tableRegex=/<table[\s\S]*?<\/table>/gi;
  const tables=html.match(tableRegex) || [];

  let targetTable=null;

  for(const table of tables){

    const text=cleanHtmlText(table);

    const lower=text.toLowerCase();

    const hasDis=
      lower.includes("disadvantage") ||
      lower.includes("невыгодное") ||
      lower.includes("countered by");

    const hasWin=
      lower.includes("hero win rate") ||
      lower.includes("доля побед");

    if(hasDis && hasWin){
      targetTable=table;
      break;
    }
  }

  if(!targetTable){

    /*
      Jina Reader / proxy can return flattened markdown.
      Try markdown-like rows.
    */

    const lines=cleanHtmlText(html)
      .split(/\n/)
      .map(x=>x.trim())
      .filter(Boolean);

    for(let i=0;i<lines.length;i++){

      const line=lines[i];

      if(
        line.toLowerCase().includes("countered by") ||
        line.toLowerCase().includes("is countered by") ||
        line.toLowerCase().includes("плох против")
      ){

        for(let j=i+1;j<Math.min(i+12,lines.length);j++){

          const pct=parsePercent(lines[j]);
          if(pct===null) continue;

          const hero=findHeroByText(lines[j]);

          if(hero && hero.id!==targetHero.id){
            result.push({
              heroId:hero.id,
              advantage:pct,
              heroWinRate:null,
              matches:null,
              source:"Dotabuff"
            });
          }
        }

        if(result.length) return result;
      }
    }

    return result;
  }

  const rows=targetTable.match(/<tr[\s\S]*?<\/tr>/gi) || [];

  for(const row of rows){

    const cells=[
      ...(row.match(/<td[\s\S]*?<\/td>/gi)||[]),
      ...(row.match(/<th[\s\S]*?<\/th>/gi)||[])
    ];

    if(cells.length<2) continue;

    const texts=cells.map(cleanHtmlText);

    const pct=parsePercent(texts.join(" "));

    if(pct===null) continue;

    let hero=null;

    for(const txt of texts){
      hero=findHeroByText(txt);
      if(hero) break;
    }

    if(!hero || hero.id===targetHero.id) continue;

    const winRateMatch=texts
      .map(parsePercent)
      .filter(x=>x!==null);

    let heroWinRate=null;

    if(winRateMatch.length>=2){
      heroWinRate=winRateMatch[1];
    }

    let matches=null;

    for(const txt of texts){
      const n=parseNumber(txt);

      if(n && n>100){
        matches=n;
      }
    }

    result.push({
      heroId:hero.id,
      advantage:pct,
      heroWinRate,
      matches,
      source:"Dotabuff"
    });
  }

  return result;
}

/* ---------------------------------------------------------
   Dotabuff fetching
--------------------------------------------------------- */

async function fetchDotabuffCounters(hero,force=false){

  const key=heroKey(hero);

  if(!force){

    const cached=readCache(
      "counter:"+key,
      CACHE_TTL
    );

    if(cached?.length){
      state.counters[hero.id]=cached;
      state.counterUpdated[hero.id]=cached._time || Date.now();

      /*
        ВАЖНО:
        даже если есть cache — не ждём его.
        background refresh запускается отдельно.
      */

      refreshDotabuffBackground(hero);
      return cached;
    }
  }

  if(state.counterLoading[hero.id]){
    return state.counters[hero.id] || knownCountersFor(hero);
  }

  state.counterLoading[hero.id]=true;

  const slug=dotabuffSlug(hero);

  const target =
    `${DOTABUFF_BASE}${slug}/counters?date=week`;

  const urls=[

    /* direct */
    target,

    /* allorigins */
    "https://api.allorigins.win/raw?url="+
      encodeURIComponent(target),

    /* corsproxy */
    "https://corsproxy.io/?url="+
      encodeURIComponent(target),

    /* Jina reader — очень полезный fallback для GitHub Pages */
    "https://r.jina.ai/http://www.dotabuff.com/heroes/"+
      encodeURIComponent(slug)+
      "/counters?date=week"

  ];

  for(const url of urls){

    try{

      const html=await fetchText(url,5500);

      const parsed=parseDotabuffCounters(
        html,
        hero
      );

      if(parsed.length){

        writeCache(
          "counter:"+key,
          parsed
        );

        state.counters[hero.id]=parsed;
        state.counterUpdated[hero.id]=Date.now();
        state.counterLoading[hero.id]=false;

        return parsed;
      }

    }catch(e){
      console.warn("Counter source failed:",url,e);
    }
  }

  state.counterLoading[hero.id]=false;

  /*
    Даже если интернет/proxy не работает,
    приложение не ломается.
  */

  const fallback=knownCountersFor(hero);

  if(fallback.length){
    state.counters[hero.id]=fallback;
    return fallback;
  }

  state.counters[hero.id]=[];
  return [];
}

function refreshDotabuffBackground(hero){

  if(state.counterLoading[hero.id]) return;

  /*
    Не ждём background refresh.
  */

  fetchDotabuffCounters(hero,true)
    .then(()=>{
      if(state.currentTab==="counters"){
        renderCounters();
      }

      if(state.currentTab==="draft"){
        renderDraft();
      }

      if(state.currentTab==="analysis"){
        renderAnalysis();
      }
    })
    .catch(()=>{});
}

/* ---------------------------------------------------------
   Matchup direction
--------------------------------------------------------- */

/*
  getPairAdvantage(A,B)

  + = A контрит B
  - = B контрит A
*/

function getPairAdvantage(heroA,heroB){

  if(!heroA || !heroB) return null;

  if(heroA.id===heroB.id) return 0;

  /* 
     Самый важный путь:

     Если мы знаем counters страницы B,
     и там A:
       A -> B = +advantage
  */

  const bData=state.counters[heroB.id];

  if(bData?.length){

    const row=bData.find(x=>x.heroId===heroA.id);

    if(row){
      return Number(row.advantage);
    }
  }

  /*
    Если известна страница A и B находится там,
    значит B контрит A.
  */

  const aData=state.counters[heroA.id];

  if(aData?.length){

    const row=aData.find(x=>x.heroId===heroB.id);

    if(row){
      return -Number(row.advantage);
    }
  }

  /* fallback */

  const knownB=knownCountersFor(heroB)
    .find(x=>x.heroId===heroA.id);

  if(knownB){
    return Number(knownB.advantage);
  }

  const knownA=knownCountersFor(heroA)
    .find(x=>x.heroId===heroB.id);

  if(knownA){
    return -Number(knownA.advantage);
  }

  return null;
}

/* ---------------------------------------------------------
   Synergy
--------------------------------------------------------- */

function pairKey(a,b){
  const aa=heroKey(a);
  const bb=heroKey(b);

  return aa<bb
    ? `${aa}|${bb}`
    : `${bb}|${aa}`;
}

function getSynergy(a,b){

  if(!a || !b || a.id===b.id){
    return 0;
  }

  return SYNERGY_RULES[pairKey(a,b)] || 0;
}

/* ---------------------------------------------------------
   Selected heroes
--------------------------------------------------------- */

function selectedIds(){
  return new Set(
    [...state.own,...state.enemy]
      .filter(Boolean)
      .map(h=>h.id)
  );
}

function isSelected(hero){
  return selectedIds().has(hero.id);
}

function currentOpenRole(){

  for(let i=0;i<5;i++){

    if(!state.own[i]){
      return {

        role:ROLE_NAMES[i]
      };
    }
  }

  return null;
}

/* ---------------------------------------------------------
   Counter-aware recommendation engine
--------------------------------------------------------- */

function counterComponent(candidate){

  const enemies=state.enemy.filter(Boolean);

  if(!enemies.length){
    return {
      score:50,
      total:0,
      details:[]
    };
  }

  let total=0;
  const details=[];

  for(const enemy of enemies){

    const advantage=
      getPairAdvantage(candidate,enemy);

    if(advantage===null) continue;

    /*
      Контр должен реально влиять на итог.
      5% advantage заметно сильнее 1%.
    */

    const contribution=
      clamp(50 + advantage*10,20,100);

    total+=contribution;

    details.push({
      enemy,
      advantage
    });
  }

  if(!details.length){
    return {
      score:45,
      total:0,
      details:[]
    };
  }

  return {
    score:total/details.length,
    total,
    details
  };
}

function synergyComponent(candidate){

  const allies=state.own.filter(Boolean);

  if(!allies.length){
    return {
      score:50,
      total:0,
      details:[]
    };
  }

  let total=0;
  const details=[];

  for(const ally of allies){

    const s=getSynergy(candidate,ally);

    if(s>0){
      total+=s;
      details.push({
        ally,
        value:s
      });
    }
  }

  const score=
    clamp(
      45 + total*8,
      20,
      100
    );

  return {
    score,
    total,
    details
  };
}

function scoreCandidate(candidate,role){

  const roleScore=roleFit(candidate,role);

  const meta=getMetaEntry(candidate,role);

  const metaScore=meta
    ? clamp(
        50+(meta.rating-45)*1.1,
        20,
        100
      )
    : 40;

  const counter=counterComponent(candidate);
  const synergy=synergyComponent(candidate);

  /*
    КЛЮЧЕВОЕ ИЗМЕНЕНИЕ:

    Когда есть враги, counter становится
    самым весомым фактором.

    Было условно:
      meta > counter

    Теперь:
      counter 50%
      role    25%
      synergy 15%
      meta    10%

    Если врагов ещё нет:
      role/meta/synergy работают.
  */

  const hasEnemies=state.enemy.some(Boolean);

  let final;

  if(hasEnemies){

    final =
      counter.score * 0.50 +
      roleScore    * 0.25 +
      synergy.score* 0.15 +
      metaScore    * 0.10;

  }else{

    final =
      roleScore    * 0.40 +
      metaScore    * 0.35 +
      synergy.score* 0.25;
  }

  /*
    Жёсткое наказание за роль.

    Это не позволит условному Mirana
    всплыть как carry только потому,
    что она в общем списке имеет хорошие
    характеристики.
  */

  if(roleScore<35){
    final*=0.45;
  }

  return {
    hero:candidate,
    score:Math.round(final*10)/10,
    roleScore,
    metaScore,
    counter,
    synergy,
    meta
  };
}

function getRecommendations(){

  const open=currentOpenRole();

  if(!open){
    return [];
  }

  const selected=selectedIds();

  const candidates=state.heroes
    .filter(h=>!selected.has(h.id))
    .map(h=>scoreCandidate(h,open.role))
    .sort((a,b)=>b.score-a.score);

  /*
    Если есть хотя бы 5 нормальных role-fit кандидатов,
    не позволяем off-role героям захватить список.
  */

  const goodRole=candidates.filter(x=>x.roleScore>=45);

  if(goodRole.length>=5){
    return goodRole.slice(0,8);
  }

  return candidates.slice(0,8);
}

/* ---------------------------------------------------------
   Preload counters for enemy heroes
--------------------------------------------------------- */

async function preloadEnemyCounters(){

  const enemies=state.enemy.filter(Boolean);

  if(!enemies.length){
    return;
  }

  /*
    Максимум 5 страниц.

    Именно страницы ВРАЖЕСКИХ героев дают нам:
      "кто контрит этого врага?"

    Поэтому для рекомендаций не нужно
    скачивать страницы всех 127 героев.
  */

  const queue=enemies.slice();

  const workers=Array.from(
    {length:Math.min(3,queue.length)},
    async()=>{

      while(queue.length){

        const enemy=queue.shift();

        try{
          await fetchDotabuffCounters(enemy,false);
        }catch{}

        renderDraft();
      }
    }
  );

  await Promise.all(workers);
}

/* ---------------------------------------------------------
   Matrix hydration
--------------------------------------------------------- */

async function hydrateMatrix(){

  const enemies=state.enemy.filter(Boolean);
  const own=state.own.filter(Boolean);

  const targets=[
    ...enemies,
    ...own
  ];

  const unique=[
    ...new Map(targets.map(h=>[h.id,h])).values()
  ];

  const queue=unique.slice();

  const workers=Array.from(
    {length:Math.min(3,queue.length)},
    async()=>{

      while(queue.length){

        const hero=queue.shift();

        try{
          await fetchDotabuffCounters(hero,false);
        }catch{}

        if(state.currentTab==="analysis"){
          renderAnalysis();
        }
      }
    }
  );

  await Promise.all(workers);
}

function openPicker(side,index){

  state.pickerSide=side;
  state.pickerIndex=index;

  const hero=state[side][index];

  document.getElementById("pickerTitle").textContent=
    `${side==="own"?"Моя команда":"Враг"} · ${ROLE_LABELS[ROLE_NAMES[index]]}`;

  document.getElementById("heroSearch").value="";

  document.getElementById("picker").classList.add("show");

  renderPicker();

  setTimeout(()=>{
    document.getElementById("heroSearch").focus();
  },80);
}

function closePicker(){
  document.getElementById("picker").classList.remove("show");
}

function renderPicker(){

  const query=
    document.getElementById("heroSearch").value
      .trim()
      .toLowerCase();

  const current=
    state.pickerSide &&
    state.pickerIndex!==null
      ? state[state.pickerSide][state.pickerIndex]
      : null;

  const selected=selectedIds();

  let heroes=state.heroes.filter(hero=>{

    if(selected.has(hero.id) && hero.id!==current?.id){
      return false;
    }

    if(query){

      const n=displayName(hero).toLowerCase();

      const key=heroKey(hero).replace(/_/g," ");

      if(!n.includes(query) && !key.includes(query)){
        return false;
      }
    }

    const filter=state.pickerFilter;

    if(filter==="all"){
      return true;
    }

    const roles=hero.roles || [];

    if(filter==="carry"){
      return roles.includes("Carry");
    }

    if(filter==="mid"){
      const key=heroKey(hero);
      return !!META_SNAPSHOT.pos2.find(x=>x[0]===key);
    }

    if(filter==="offlane"){
      return roles.includes("Durable") ||
             roles.includes("Initiator") ||
             roles.includes("Disabler");
    }

    if(filter==="support"){
      return roles.includes("Support") &&
             !META_SNAPSHOT.pos5.find(x=>x[0]===heroKey(hero));
    }

    if(filter==="hard"){
      return !!META_SNAPSHOT.pos5.find(x=>x[0]===heroKey(hero));
    }

    return true;
  });

  heroes.sort((a,b)=>
    displayName(a).localeCompare(
      displayName(b),
      "en"
    )
  );

  document.getElementById("pickerGrid").innerHTML=
    heroes.map(hero=>`

      <button
        class="hero-pick"
        onclick="selectHero(${hero.id})"
      >

        <img
          src="${heroImage(hero)}"
          alt=""
          loading="lazy"
          onerror="this.style.opacity=.3"
        >

        <div class="pick-name">
          ${displayName(hero)}
        </div>

        <div class="pick-role">
          ${hero.primary_attr || ""}
        </div>

      </button>

    `).join("") ||
    `<div class="empty">Герой не найден.</div>`;
}

function selectHero(id){

  const hero=state.heroesById[id];

  if(!hero) return;

  const side=state.pickerSide;
  const index=state.pickerIndex;

  if(!side || index===null) return;

  /*
    Проверяем дубликаты.
  */

  const selected=selectedIds();

  const current=state[side][index];

  if(
    selected.has(hero.id) &&
    hero.id!==current?.id
  ){

    toast("Этот герой уже выбран");
    return;
  }

  state[side][index]=hero;

  closePicker();

  invalidateAnalysis();

  renderCurrent();

  /*
    Если выбран враг — немедленно
    запускаем загрузку именно его counter page.

    Не ждём.
  */

  if(side==="enemy"){

    fetchDotabuffCounters(hero,false)
      .then(()=>{
        if(state.currentTab==="draft"){
          renderDraft();
        }
      });

  }

  if(side==="own"){

    /*
      При добавлении своего героя
      также полезно подтянуть его matchup
      для отрицательных ячеек матрицы.
    */

    fetchDotabuffCounters(hero,false)
      .then(()=>{
        if(state.currentTab==="draft"){
          renderDraft();
        }
      });
  }
}

function removeHero(side,index){

  state[side][index]=null;

  invalidateAnalysis();

  renderCurrent();
}

   Finish / Analysis
--------------------------------------------------------- */

function finishDraft(){

  if(
    !state.own.every(Boolean) ||
    !state.enemy.every(Boolean)
  ){

    toast("Нужно выбрать 5 своих и 5 вражеских героев");
    return;
  }

  state.analysis=buildAnalysis();

  switchTab("analysis");

  /*
    Фоном обновляем matchup данные.
  */

  hydrateMatrix();
}

function buildAnalysis(){

  const own=state.own;
  const enemy=state.enemy;

  let counterTotal=0;
  let counterCount=0;

  const threats=[];
  const ownCounters=[];

  for(const my of own){

    let rowScore=0;

    for(const foe of enemy){

      const adv=getPairAdvantage(my,foe);

      if(adv!==null){

        rowScore+=adv;
        counterTotal+=adv;
        counterCount++;
      }
    }

    if(rowScore<0){

      threats.push({
        hero:my,
        score:rowScore
      });

    }else if(rowScore>0){

      ownCounters.push({
        hero:my,
        score:rowScore
      });
    }
  }

  let synergyTotal=0;

  for(let i=0;i<own.length;i++){

    for(let j=i+1;j<own.length;j++){

      synergyTotal+=getSynergy(
        own[i],
        own[j]
      );
    }
  }

  const avgCounter=
    counterCount
      ? counterTotal/counterCount
      : 0;

  const counterScore=
    clamp(
      50 + avgCounter*7,
      0,
      100
    );

  const synergyScore=
    clamp(
      50 + synergyTotal*4,
      0,
      100
    );

  const overall=
    Math.round(
      counterScore*.60 +
      synergyScore*.25 +
      50*.15
    );

  let grade="C";

  if(overall>=82) grade="S";
  else if(overall>=72) grade="A";
  else if(overall>=60) grade="B";

  return {
    counterScore,
    synergyScore,
    overall,
    grade,
    threats,
    ownCounters
  };
}

                const loading=
                  state.counterLoading[foe.id] ||
                  state.counterLoading[my.id];

                return `
                  <td class="neutral">
                    ${loading?"…":"?"}
                  </td>
                `;
              }

              if(adv>0){

                return `
                  <td class="plus">
                    +${adv.toFixed(1)}%
                  </td>
                `;
              }

              if(adv<0){

                return `
                  <td class="minus">
                    ${adv.toFixed(1)}%
                  </td>
                `;
              }

              return `
                <td class="neutral">
                  0
                </td>
              `;

            }).join("")}

          </tr>

        `).join("")}

      </tbody>

    </table>
  `;
}

function renderSynergyMatrix(){

  const own=state.own;

  return `
    <table class="matrix">

      <thead>
        <tr>

          <th class="hero-head">
            HERO ↓ / HERO →
          </th>

          ${own.map(h=>`

            <th>
              <img src="${heroImage(h)}">
              ${displayName(h)}
            </th>

          `).join("")}

        </tr>
      </thead>

      <tbody>

        ${own.map(my=>`

          <tr>

            <th>
              <img src="${heroImage(my)}">
              ${displayName(my)}
            </th>

            ${own.map(other=>{

              if(my.id===other.id){

                return `
                  <td class="neutral">
                    —
                  </td>
                `;
              }

              const s=getSynergy(my,other);

              return `
                <td class="${s>0?"synergy":"neutral"}">
                  ${s>0?"+"+s:"0"}
                </td>
              `;

            }).join("")}

          </tr>

        `).join("")}

      </tbody>

    </table>
  `;
}

function renderWinCondition(){

  const carry=state.own[0];
  const mid=state.own[1];
  const off=state.own[2];
  const sup=state.own[3];
  const hard=state.own[4];

  const strongest=[
    carry,
    mid,
    off
  ].filter(Boolean);

  const best=
    strongest
      .map(h=>({
        hero:h,
        synergy:
          state.own
            .filter(x=>x && x.id!==h.id)
            .reduce((s,x)=>s+getSynergy(h,x),0)
      }))
      .sort((a,b)=>b.synergy-a.synergy)[0];

  return `
    <div class="good">

      <strong>
        ${
          best
            ? `Основной win condition: ${displayName(best.hero)}`
            : "Нужно выбрать ядро команды"
        }
      </strong>

      <div class="sub" style="margin-top:5px">
        ${
          best
            ? `Лучший локальный synergy score: ${best.synergy}.
               Используй сильные командные связки,
               а не только индивидуальный meta rating.`
            : ""
        }
      </div>

    </div>

    <div class="sub" style="margin-top:10px">
      Carry:
      <strong>${carry?displayName(carry):"—"}</strong><br>

      Mid:
      <strong>${mid?displayName(mid):"—"}</strong><br>

      Offlane:
      <strong>${off?displayName(off):"—"}</strong><br>

      Support:
      <strong>${sup?displayName(sup):"—"}</strong><br>

      Hard support:
      <strong>${hard?displayName(hard):"—"}</strong>
    </div>
  `;
}

/* ---------------------------------------------------------
   Counter Finder
--------------------------------------------------------- */

function renderCounters(){

  document.getElementById("content").innerHTML=`

    <div class="card">

      <div class="section-title">
        Counter Finder
      </div>

      <div class="sub">
        Введи героя. Сначала покажем сохранённые
        данные/быстрый fallback, затем автоматически
        обновим их свежей статистикой Dotabuff.
      </div>

      <div class="counter-search" style="margin-top:10px">

        <input
          id="counterInput"
          placeholder="Например: Puck"
          autocomplete="off"
        >

        <button onclick="searchCounter()">
          FIND
        </button>

      </div>

      <div
        id="counterResults"
        class="results"
      >
        <div class="empty">
          Введи героя для поиска контрпиков.
        </div>
      </div>

    </div>

    <div class="card">

      <div class="section-title">
        Как считаем
      </div>

      <div class="sub">
        Counter score — это не просто winrate героя.
        Мы берём именно matchup disadvantage/advantage,
        чтобы рекомендация отвечала на вопрос:
        «Кого поставить против конкретного врага?»
      </div>

      <div class="source-row">
        <span class="badge green">Dotabuff week</span>
        <span class="badge">D2PT role/meta</span>
        <span class="badge">OpenDota fallback</span>
      </div>

    </div>
  `;

  const input=document.getElementById("counterInput");

  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      searchCounter();
    }
  });
}

async function searchCounter(){

  const input=document.getElementById("counterInput");

  const query=input.value.trim();

  if(!query){
    toast("Введи имя героя");
    return;
  }

  let hero=
    state.heroes.find(h=>
      displayName(h).toLowerCase()===query.toLowerCase()
    );

  if(!hero){

    const q=slugify(query);

    hero=
      state.heroesByName[q] ||
      state.heroes.find(h=>
        displayName(h)
          .toLowerCase()
          .includes(query.toLowerCase())
      );
  }

  if(!hero){

    toast("Герой не найден");
    return;
  }

  const target=document.getElementById("counterResults");

  /*
    Мгновенно показываем cache/fallback.
  */

  const instant=
    state.counters[hero.id] ||
    readCache("counter:"+heroKey(hero),CACHE_TTL) ||
    knownCountersFor(hero);

  target.innerHTML=renderCounterResults(
    hero,
    instant,
    true
  );

  /*
    Потом свежий Dotabuff.
  */

  try{

    const fresh=
      await fetchDotabuffCounters(hero,true);

    target.innerHTML=
      renderCounterResults(
        hero,
        fresh,
        false
      );

  }catch{

    target.innerHTML=
      renderCounterResults(
        hero,
        instant,
        true
      );
  }
}

function renderCounterResults(
  targetHero,
  data,
  fallback
){

  const rows=(data||[])
    .slice()
    .sort((a,b)=>
      Number(b.advantage)-Number(a.advantage)
    )
    .slice(0,12);

  const updated=
    state.counterUpdated[targetHero.id];

  return `

    <div class="target-card">

      <img src="${heroImage(targetHero)}">

      <div>

        <strong>
          ${displayName(targetHero)}
        </strong>

        <div class="sub">
          ${fallback
            ? "Показываем cache/fallback · обновляем…"
            : "Свежая Dotabuff week статистика"}
        </div>

        ${
          updated
            ? `<div class="sub">
                 Обновлено:
                 ${new Date(updated).toLocaleTimeString(
                   "ru-RU",
                   {hour:"2-digit",minute:"2-digit"}
                 )}
               </div>`
            : ""
        }

      </div>

    </div>

    ${
      rows.length
        ? rows.map(row=>{

            const hero=
              state.heroesById[row.heroId];

            if(!hero) return "";

            return `

              <div class="counter-item">

                <img src="${heroImage(hero)}">

                <div class="counter-main">

                  <div class="counter-name">
                    ${displayName(hero)}
                  </div>

                  <div class="counter-meta">

                    ${
                      row.source==="Dotabuff"
                        ? "Dotabuff"
                        : "быстрый fallback"
                    }

                    ${
                      row.matches
                        ? ` · ${row.matches.toLocaleString()} матчей`
                        : ""
                    }

                  </div>

                </div>

                <div>

                  <div class="adv">
                    +${Number(row.advantage).toFixed(2)}%
                  </div>

                  ${
                    row.heroWinRate
                      ? `<div class="win">
                           WR ${Number(row.heroWinRate).toFixed(2)}%
                         </div>`
                      : ""
                  }

                </div>

              </div>
            `;

          }).join("")
        : `
          <div class="empty">
            Для этого героя пока нет данных.
          </div>
        `
    }
  `;
}

/* ---------------------------------------------------------
   Meta
--------------------------------------------------------- */

  const active=
    window.__metaRole || "pos1";

  const rows=
    META_SNAPSHOT[active]
      .map(row=>{

        const hero=
          state.heroesByName[row[0]];

        if(!hero) return "";

        return `

          <div class="meta-item">

            <img src="${heroImage(hero)}">

            <div>

              <div class="meta-name">
                ${displayName(hero)}
              </div>

              <div class="meta-sub">
                ${ROLE_LABELS[active]}
                · ${row[3].toLocaleString()} matches
              </div>

            </div>

            <div class="meta-rating">

              ${row[1].toFixed(1)}

              <small>
                WR ${row[2].toFixed(1)}%
              </small>

            </div>

          </div>
        `;
      })
      .join("");

  document.getElementById("content").innerHTML=`

    <div class="card">

      <div class="section-title">
        Meta 7.41e
      </div>

      <div class="sub">
        Meta используется для оценки роли и качества
        кандидата. Во время драфта она НЕ заменяет
        matchup против конкретных врагов.
      </div>

      <div class="source-row">
        <span class="badge green">D2PT</span>
        <span class="badge">7000+ MMR / pro</span>
      </div>

    </div>

    <div class="card">

      <div class="meta-tabs">

        ${ROLE_NAMES.map(role=>`

          <button
            class="meta-tab ${role===active?"active":""}"
            onclick="changeMetaRole('${role}')"
          >
            ${ROLE_LABELS[role]}
          </button>

        `).join("")}

      </div>

      <div class="meta-list">
        ${rows || `
          <div class="empty">
            Нет meta snapshot.
          </div>
        `}
      </div>

    </div>

    <div class="card">

      <div class="sub">
        Важно: D2PT использует высокорейтинговые
        и профессиональные данные. Snapshot нужен,
        чтобы приложение не зависело от сети при
        каждом открытии страницы.
      </div>

      <div class="source-row">
        <a
          class="badge green"
          href="https://dota2protracker.com/"
          target="_blank"
          rel="noopener"
        >
          Открыть Dota2ProTracker
        </a>
      </div>

    </div>
  `;
}

function changeMetaRole(role){
  window.__metaRole=role;
  renderMeta();
}

/* ---------------------------------------------------------
   Tabs
--------------------------------------------------------- */

function switchTab(tab){

  state.currentTab=tab;

  document.querySelectorAll(".tab").forEach(el=>{
    el.classList.toggle(
      "active",
      el.dataset.tab===tab
    );
  });

  document.querySelectorAll(".bottom-nav button").forEach(el=>{
    el.classList.toggle(
      "active",
      el.dataset.tab===tab
    );
  });

  renderCurrent();
}

function renderCurrent(){

  if(state.currentTab==="draft"){
    renderDraft();
    return;
  }

  if(state.currentTab==="counters"){
    renderCounters();
    return;
  }

  if(state.currentTab==="meta"){
    renderMeta();
    return;
  }

  if(state.currentTab==="analysis"){
    renderAnalysis();
  }
}

/* ---------------------------------------------------------
   Events
--------------------------------------------------------- */

document.querySelectorAll(".tab").forEach(button=>{
  button.addEventListener("click",()=>{
    switchTab(button.dataset.tab);
  });
});

document.querySelectorAll(".bottom-nav button").forEach(button=>{
  button.addEventListener("click",()=>{
    switchTab(button.dataset.tab);
  });
});

document.getElementById("closePicker")
  .addEventListener("click",closePicker);

document.getElementById("heroSearch")
  .addEventListener("input",renderPicker);

document.querySelectorAll(".filter")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      state.pickerFilter=button.dataset.filter;

      document.querySelectorAll(".filter")
        .forEach(x=>
          x.classList.toggle(
            "active",
            x===button
          )
        );

      renderPicker();
    });

  });

/* закрытие picker по тапу вне окна */

document.getElementById("picker")
  .addEventListener("click",e=>{

    if(e.target.id==="picker"){
      closePicker();
    }

  });

/* ---------------------------------------------------------
   Boot
--------------------------------------------------------- */

async function boot(){

  await loadHeroes();

  renderDraft();

  /*
    Если в localStorage есть старые counters —
    они используются сразу.
  */

  setStatus(
    `${state.heroes.length} героев · готово`,
    "ok"
  );
}

boot();
