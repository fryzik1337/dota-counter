<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dota Draft Lab</title>

<style>
:root{
  --bg:#070a0f;
  --panel:#0e141d;
  --panel2:#121a25;
  --line:#253140;
  --text:#f5f7fa;
  --muted:#7e8b9b;
  --accent:#e65b45;
  --accent2:#ff8a65;
  --green:#55d68a;
  --blue:#5da9ff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:
    radial-gradient(circle at 10% 0%,rgba(230,91,69,.13),transparent 30%),
    radial-gradient(circle at 90% 15%,rgba(93,169,255,.10),transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  min-height:100%;
}

body{
  padding-bottom:30px;
}

button,input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.top{
  position:sticky;
  top:0;
  z-index:50;
  padding:
    max(14px,env(safe-area-inset-top))
    15px 12px;
  background:rgba(7,10,15,.88);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:40px;
  height:40px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ef654d,#8c2118);
  box-shadow:0 8px 30px rgba(230,91,69,.25);
  font-size:21px;
}

.logo-title{
  font-weight:900;
  font-size:19px;
  letter-spacing:-.4px;
}

.logo-sub{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.live{
  display:flex;
  align-items:center;
  gap:5px;
  color:#72df9a;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#58dc8a;
  box-shadow:0 0 12px #58dc8a;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:13px;
}

.tab{
  border:1px solid var(--line);
  background:#0d131c;
  color:#8793a3;
  padding:11px 8px;
  border-radius:12px;
  font-size:12px;
  font-weight:850;
}

.tab.active{
  color:#fff;
  background:linear-gradient(135deg,#2a3442,#171f2a);
  border-color:#48576a;
  box-shadow:inset 0 1px rgba(255,255,255,.06);
}

main{
  width:min(920px,100%);
  margin:auto;
  padding:13px;
}

.page{display:none}
.page.active{display:block}

.card{
  background:linear-gradient(145deg,rgba(18,26,37,.97),rgba(11,16,24,.97));
  border:1px solid rgba(255,255,255,.065);
  border-radius:18px;
  margin-bottom:12px;
  padding:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.18);
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.title{
  font-size:14px;
  font-weight:900;
  letter-spacing:-.2px;
}

.hint{
  font-size:10px;
  color:var(--muted);
}

.pos-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.pos{
  position:relative;
  overflow:hidden;
  border:1px solid #293543;
  background:#0d141d;
  border-radius:12px;
  color:#7e8b9b;
  padding:11px 2px 10px;
  font-size:10px;
  font-weight:900;
}

.pos small{
  display:block;
  font-size:8px;
  opacity:.65;
  margin-top:3px;
}

.pos.active{
  color:#fff;
  border-color:#b64d3d;
  background:linear-gradient(145deg,#3b211e,#1b1517);
  box-shadow:0 0 25px rgba(230,91,69,.12);
}

.pos.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:2px;
  background:#ef674f;
}

.search-wrap{
  position:relative;
  margin-bottom:10px;
}

.search{
  width:100%;
  height:43px;
  padding:0 13px 0 39px;
  border:1px solid #283442;
  border-radius:12px;
  outline:none;
  color:#fff;
  background:#090e15;
}

.search:focus{
  border-color:#55677b;
  box-shadow:0 0 0 3px rgba(93,169,255,.06);
}

.search-icon{
  position:absolute;
  left:13px;
  top:12px;
  color:#718093;
}

.filters{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:9px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{display:none}

.filter{
  white-space:nowrap;
  border:1px solid #273341;
  background:#0b1119;
  color:#8996a6;
  border-radius:20px;
  padding:7px 10px;
  font-size:10px;
  font-weight:800;
}

.filter.active{
  background:#273544;
  color:#fff;
  border-color:#536579;
}

.hero-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.hero{
  min-width:0;
  position:relative;
  overflow:hidden;
  border:1px solid #25303d;
  background:#0d141d;
  border-radius:12px;
  padding:4px;
  color:#fff;
  text-align:left;
  transition:.15s;
}

.hero:active{
  transform:scale(.96);
}

.hero.selected{
  border-color:#e15e49;
  box-shadow:
    0 0 0 1px #e15e49,
    0 7px 25px rgba(230,91,69,.13);
}

.hero.taken{
  opacity:.24;
}

.hero img{
  width:100%;
  aspect-ratio:1.32/1;
  object-fit:cover;
  display:block;
  border-radius:8px;
  background:#171e28;
}

.hero-name{
  padding:5px 3px 4px;
  font-size:9px;
  font-weight:800;
  line-height:11px;
  min-height:21px;
}

.hero-tag{
  position:absolute;
  top:7px;
  right:7px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.12);
  border-radius:6px;
  padding:3px 4px;
  font-size:7px;
  font-weight:900;
}

.team{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.team-slot{
  position:relative;
  overflow:hidden;
  min-width:0;
  aspect-ratio:.76/1;
  border:1px solid #263240;
  border-radius:12px;
  background:#0a1017;
}

.team-slot.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#596777;
}

.team-slot img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.slot-number{
  position:absolute;
  left:5px;
  top:5px;
  z-index:2;
  padding:3px 5px;
  background:rgba(0,0,0,.7);
  border-radius:5px;
  font-size:8px;
  font-weight:900;
}

.slot-name{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:16px 4px 5px;
  background:linear-gradient(transparent,rgba(0,0,0,.92));
  font-size:8px;
  font-weight:800;
  text-align:center;
}

.remove{
  position:absolute;
  right:4px;
  top:4px;
  width:21px;
  height:21px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.72);
  color:#fff;
  font-size:11px;
  z-index:4;
}

.enemy-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.enemy{
  position:relative;
  aspect-ratio:.76/1;
  border:1px dashed #354251;
  border-radius:12px;
  background:#0a1017;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#5f6c7b;
  font-size:9px;
  text-align:center;
}

.enemy img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.enemy-label{
  position:absolute;
  top:5px;
  left:5px;
  background:rgba(0,0,0,.75);
  padding:3px 5px;
  border-radius:5px;
  color:#fff;
  font-size:8px;
  font-weight:900;
}

.enemy-name{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:15px 3px 5px;
  background:linear-gradient(transparent,rgba(0,0,0,.95));
  color:#fff;
  font-size:8px;
  font-weight:800;
  text-align:center;
}

.enemy-add{
  border:0;
  width:100%;
  margin-top:8px;
  border-radius:11px;
  padding:10px;
  color:#8d9aaa;
  background:#111a24;
  border:1px dashed #334151;
  font-size:11px;
  font-weight:800;
}

.recommendation{
  display:flex;
  gap:10px;
  align-items:center;
  padding:9px;
  border:1px solid #26313e;
  border-radius:13px;
  background:#0c131c;
  margin-bottom:7px;
}

.rank{
  width:24px;
  color:#667485;
  font-weight:900;
  font-size:11px;
  text-align:center;
}

.rec-img{
  width:52px;
  height:52px;
  border-radius:9px;
  object-fit:cover;
}

.rec-info{
  flex:1;
  min-width:0;
}

.rec-name{
  font-size:12px;
  font-weight:900;
}

.rec-reason{
  margin-top:3px;
  color:#8491a1;
  font-size:9px;
  line-height:13px;
}

.score{
  min-width:48px;
  text-align:center;
  color:#70dd98;
  font-size:12px;
  font-weight:900;
}

.score small{
  display:block;
  color:#667485;
  font-size:7px;
  margin-top:2px;
}

.empty{
  padding:20px 8px;
  color:#627080;
  text-align:center;
  font-size:11px;
  line-height:16px;
}

.counter-hero{
  display:flex;
  gap:12px;
  align-items:center;
  padding:10px;
  border:1px solid #2b3745;
  border-radius:14px;
  background:#0b121b;
}

.counter-hero img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
}

.counter-hero-name{
  font-size:17px;
  font-weight:950;
}

.counter-hero-role{
  color:#778596;
  font-size:10px;
  margin-top:4px;
}

.counter-result{
  margin-top:10px;
}

.reason-box{
  margin-top:7px;
  color:#8d99a8;
  font-size:9px;
  line-height:13px;
}

.big-button{
  width:100%;
  border:0;
  padding:12px;
  border-radius:12px;
  color:#fff;
  font-weight:900;
  background:linear-gradient(135deg,#d95843,#86281e);
  box-shadow:0 10px 30px rgba(217,88,67,.15);
}

@media(min-width:600px){
  .hero-grid{
    grid-template-columns:repeat(7,1fr);
  }
}

@media(max-width:350px){
  .hero-grid{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<header class="top">

  <div class="brand">

    <div class="logo">

      <div class="logo-icon">⚔️</div>

      <div>
        <div class="logo-title">DOTA DRAFT LAB</div>
        <div class="logo-sub">COUNTER • DRAFT • ANALYSIS</div>
      </div>

    </div>

    <div class="live">
      <span class="live-dot"></span>
      LIVE
    </div>

  </div>

  <div class="tabs">

    <button class="tab active" onclick="openTab('draft',this)">
      ⚔️ DRAFT ASSISTANT
    </button>

    <button class="tab" onclick="openTab('counter',this)">
      🎯 COUNTER FINDER
    </button>

  </div>

</header>


<main>

<!-- ========================= -->
<!-- DRAFT -->
<!-- ========================= -->

<div id="draft" class="page active">

  <div class="card">

    <div class="card-head">
      <div class="title">YOUR POSITION</div>
      <div class="hint">Choose role</div>
    </div>

    <div class="pos-grid">

      <button class="pos active" onclick="setPos(1,this)">
        POS 1
        <small>CARRY</small>
      </button>

      <button class="pos" onclick="setPos(2,this)">
        POS 2
        <small>MID</small>
      </button>

      <button class="pos" onclick="setPos(3,this)">
        POS 3
        <small>OFFLANE</small>
      </button>

      <button class="pos" onclick="setPos(4,this)">
        POS 4
        <small>SUPPORT</small>
      </button>

      <button class="pos" onclick="setPos(5,this)">
        POS 5
        <small>HARD SUP</small>
      </button>

    </div>

  </div>


  <div class="card">

    <div class="card-head">
      <div class="title">CHOOSE YOUR HERO</div>
      <div class="hint" id="heroCount">128 heroes</div>
    </div>

    <div class="search-wrap">

      <span class="search-icon">⌕</span>

      <input
        id="heroSearch"
        class="search"
        placeholder="Search hero..."
        oninput="renderHeroes()"
      >

    </div>

    <div class="filters">

      <button class="filter active" onclick="setFilter('ALL',this)">ALL</button>
      <button class="filter" onclick="setFilter('Strength',this)">💪 STR</button>
      <button class="filter" onclick="setFilter('Agility',this)">⚡ AGI</button>
      <button class="filter" onclick="setFilter('Intelligence',this)">🧠 INT</button>
      <button class="filter" onclick="setFilter('Universal',this)">◈ UNI</button>

    </div>

    <div id="heroes" class="hero-grid"></div>

  </div>


  <div class="card">

    <div class="card-head">
      <div class="title">YOUR DRAFT</div>
      <div class="hint">5 positions</div>
    </div>

    <div id="team" class="team"></div>

  </div>


  <div class="card">

    <div class="card-head">
      <div class="title">ENEMY DRAFT</div>
      <div class="hint" id="enemyCounter">0 / 5</div>
    </div>

    <div id="enemies" class="enemy-grid"></div>

    <button class="enemy-add" onclick="addEnemy()">
      ＋ ADD ENEMY HERO
    </button>

  </div>


  <div class="card">

    <div class="card-head">
      <div class="title">🔥 BEST PICKS</div>
      <div class="hint">Draft recommendation</div>
    </div>

    <div id="recommendations"></div>

  </div>

</div>


<!-- ========================= -->
<!-- COUNTER -->
<!-- ========================= -->

<div id="counter" class="page">

  <div class="card">

    <div class="card-head">

      <div>
        <div class="title">COUNTER FINDER</div>
        <div class="hint">Find the best answers to an enemy hero</div>
      </div>

    </div>

    <div class="search-wrap">

      <span class="search-icon">⌕</span>

      <input
        id="counterSearch"
        class="search"
        placeholder="Search enemy hero..."
        oninput="renderCounterHeroes()"
      >

    </div>

    <div id="counterHeroes" class="hero-grid"></div>

  </div>


  <div id="counterResult"></div>

</div>

</main>

/* =====================================================
   STATE
===================================================== */

let position=1;
let filter="ALL";

const team={
  1:null,
  2:null,
  3:null,
  4:null,
  5:null
};

let enemies=[];
let counterTarget=null;


/* =====================================================
   PORTRAIT SYSTEM
===================================================== */

function portrait(hero){

  return [
    `https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/${hero.slug}.png`,
    `https://cdn.dota2.com/apps/dota2/images/heroes/${hero.slug}_full.png`
  ];
}


function imgHTML(hero,className=""){

  const urls=portrait(hero);

  return `
    <img
      class="${className}"
      src="${urls[0]}"
      data-fallback="${urls[1]}"
      onerror="
        if(this.dataset.fallback && this.src!==this.dataset.fallback){
          this.src=this.dataset.fallback;
        }else{
          this.style.display='none';
        }
      "
      alt="${hero.name}"
    >
  `;
}


/* =====================================================
   TABS
===================================================== */

function openTab(id,btn){

  document.querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  document.querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  btn.classList.add("active");

  if(id==="counter"){
    renderCounterHeroes();
  }
}


/* =====================================================
   POSITION
===================================================== */

function setPos(pos,btn){

  position=pos;

  document.querySelectorAll(".pos")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  renderHeroes();
}


/* =====================================================
   FILTER
===================================================== */

function setFilter(value,btn){

  filter=value;

  document.querySelectorAll(".filter")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  renderHeroes();
}


/* =====================================================
   TAKEN
===================================================== */

function taken(id){

  return Object.values(team)
    .filter(Boolean)
    .some(h=>h.id===id);
}


/* =====================================================
   HEROES
===================================================== */

function renderHeroes(){

  const query=
    document.getElementById("heroSearch")
      .value
      .toLowerCase()
      .trim();

  let list=HEROES.filter(h=>{

    if(!h.name.toLowerCase().includes(query))
      return false;

    if(filter!=="ALL" && h.attr!==filter)
      return false;

    return true;
  });

  document.getElementById("heroCount")
    .textContent=list.length+" heroes";

  document.getElementById("heroes")
    .innerHTML=list.map(hero=>{

      const disabled=
        taken(hero.id) &&
        team[position]?.id!==hero.id;

      const selected=
        team[position]?.id===hero.id;

      const attr={
        Strength:"STR",
        Agility:"AGI",
        Intelligence:"INT",
        Universal:"UNI"
      }[hero.attr];

      return `
        <button
          class="hero ${disabled?"taken":""} ${selected?"selected":""}"
          ${disabled?"disabled":""}
          onclick="pickHero(${hero.id})"
        >

          ${imgHTML(hero)}

          <span class="hero-tag">${attr}</span>

          <div class="hero-name">
            ${hero.name}
          </div>

        </button>
      `;

    }).join("");
}


/* =====================================================
   PICK HERO
===================================================== */

function pickHero(id){

  const hero=HEROES.find(h=>h.id===id);

  if(!hero)return;

  for(let p=1;p<=5;p++){

    if(
      p!==position &&
      team[p]?.id===hero.id
    ){
      return;
    }
  }

  team[position]=hero;

  renderTeam();
  renderHeroes();
  renderRecommendations();
}


/* =====================================================
   TEAM
===================================================== */

function renderTeam(){

  document.getElementById("team").innerHTML=
    [1,2,3,4,5].map(p=>{

      const hero=team[p];

      if(!hero){

        return `
          <div class="team-slot empty">
            <b>POS ${p}</b>
            <span>EMPTY</span>
          </div>
        `;
      }

      return `
        <div class="team-slot">

          <span class="slot-number">
            POS ${p}
          </span>

          ${imgHTML(hero)}

          <button
            class="remove"
            onclick="removeTeam(${p})"
          >
            ×
          </button>

          <div class="slot-name">
            ${hero.name}
          </div>

        </div>
      `;

    }).join("");
}


function removeTeam(p){

  team[p]=null;

  renderTeam();
  renderHeroes();
  renderRecommendations();
}


/* =====================================================
   ENEMIES
===================================================== */

function addEnemy(){

  if(enemies.length>=5)return;

  enemies.push(null);

  renderEnemies();
}


function renderEnemies(){

  document.getElementById("enemyCounter")
    .textContent=enemies.filter(Boolean).length+" / 5";

  document.getElementById("enemies").innerHTML=
    [0,1,2,3,4].map(i=>{

      const hero=enemies[i];

      if(!hero){

        return `
          <button
            class="enemy"
            onclick="chooseEnemyFromList(${i})"
          >
            <div>
              ＋<br>
              ENEMY ${i+1}
            </div>
          </button>
        `;
      }

      return `
        <div class="enemy">

          ${imgHTML(hero)}

          <div class="enemy-label">
            ${i+1}
          </div>

          <button
            class="remove"
            onclick="removeEnemy(${i})"
          >
            ×
          </button>

          <div class="enemy-name">
            ${hero.name}
          </div>

        </div>
      `;

    }).join("");
}


function chooseEnemyFromList(index){

  const name=prompt(
    "Напиши имя героя противника:"
  );

  if(!name)return;

  const hero=HEROES.find(
    h=>h.name.toLowerCase()===
       name.toLowerCase().trim()
  );

  if(hero){

    enemies[index]=hero;
    renderEnemies();
    renderRecommendations();

  }else{

    alert("Герой не найден. Используй точное имя.");

  }
}


function removeEnemy(index){

  enemies.splice(index,1);

  renderEnemies();
  renderRecommendations();
}


/* =====================================================
   COUNTER SCORE
===================================================== */

function scoreAgainst(candidate,enemy){

  const c=ROLES[candidate.name]||[];
  const e=ROLES[enemy.name]||[];

  let score=0;

  if(e.includes("Carry") && c.includes("Disabler"))
    score+=9;

  if(e.includes("Carry") && c.includes("Nuker"))
    score+=5;

  if(e.includes("Nuker") && c.includes("Durable"))
    score+=7;

  if(e.includes("Nuker") && c.includes("Escape"))
    score+=4;

  if(e.includes("Carry") && c.includes("Initiator"))
    score+=4;

  if(c.includes("Push"))
    score+=2;

  if(c.includes("Durable") && e.includes("Carry"))
    score+=2;

  return score;
}


/* =====================================================
   RECOMMENDATIONS
===================================================== */

function renderRecommendations(){

  const box=
    document.getElementById("recommendations");

  const enemyList=
    enemies.filter(Boolean);

  if(!enemyList.length){

    box.innerHTML=`
      <div class="empty">
        Добавь врагов выше —<br>
        и здесь появятся лучшие варианты пика.
      </div>
    `;

    return;
  }

  let candidates=
    HEROES.filter(hero=>{

      if(taken(hero.id))return false;

      if(enemyList.some(e=>e.id===hero.id))
        return false;

      const roles=ROLES[hero.name]||[];

      return roles.includes(String(position));

    });


  candidates=candidates.map(hero=>{

    let score=0;

    enemyList.forEach(enemy=>{
      score+=scoreAgainst(hero,enemy);
    });

    const roles=ROLES[hero.name]||[];

    if(position===1 && roles.includes("Carry"))
      score+=5;

    if(position===2 && roles.includes("Nuker"))
      score+=4;

    if(position===3 && roles.includes("Durable"))
      score+=5;

    if((position===4||position===5)&&roles.includes("Support"))
      score+=5;

    if(roles.includes("Disabler"))
      score+=1;

    return {hero,score};

  })
  .sort((a,b)=>b.score-a.score)
  .slice(0,8);


  box.innerHTML=candidates.map((item,i)=>{

    const roles=
      (ROLES[item.hero.name]||[])
        .filter(x=>!["1","2","3","4","5"].includes(x))
        .slice(0,3)
        .join(" • ");

    return `
      <div class="recommendation">

        <div class="rank">
          #${i+1}
        </div>

        ${imgHTML(item.hero,"rec-img")}

        <div class="rec-info">

          <div class="rec-name">
            ${item.hero.name}
          </div>

          <div class="rec-reason">
            ${roles||"Flexible pick"} • strong draft fit
          </div>

        </div>

        <div class="score">
          ${item.score}
          <small>SCORE</small>
        </div>

      </div>
    `;

  }).join("");
}


/* =====================================================
   COUNTER FINDER
===================================================== */

function renderCounterHeroes(){

  const query=
    document.getElementById("counterSearch")
      .value
      .toLowerCase()
      .trim();

  const list=
    HEROES.filter(h=>
      h.name.toLowerCase().includes(query)
    );

  document.getElementById("counterHeroes")
    .innerHTML=list.map(hero=>{

      return `
        <button
          class="hero ${counterTarget?.id===hero.id?"selected":""}"
          onclick="selectCounter(${hero.id})"
        >

          ${imgHTML(hero)}

          <div class="hero-name">
            ${hero.name}
          </div>

        </button>
      `;

    }).join("");
}


function selectCounter(id){

  counterTarget=
    HEROES.find(h=>h.id===id);

  renderCounterHeroes();
  renderCounterResult();
}


/* =====================================================
   COUNTER RESULT
===================================================== */

function renderCounterResult(){

  const box=
    document.getElementById("counterResult");

  if(!counterTarget){

    box.innerHTML="";
    return;
  }


  let counters=
    HEROES
      .filter(h=>h.id!==counterTarget.id)
      .map(hero=>({
        hero,
        score:scoreAgainst(hero,counterTarget)
      }))
      .sort((a,b)=>b.score-a.score)
      .slice(0,8);


  const roles=
    ROLES[counterTarget.name]||[];


  box.innerHTML=`

    <div class="card">

      <div class="counter-hero">

        ${imgHTML(counterTarget)}

        <div>

          <div class="counter-hero-name">
            ${counterTarget.name}
          </div>

          <div class="counter-hero-role">
            ${roles.join(" • ")}
          </div>

        </div>

      </div>

    </div>


    <div class="card">

      <div class="card-head">

        <div class="title">
          🎯 BEST COUNTERS
        </div>

        <div class="hint">
          Top 8
        </div>

      </div>

      <div class="counter-result">

        ${counters.map((item,i)=>{

          const r=
            ROLES[item.hero.name]||[];

          let reason=
            "полезный набор инструментов против этого героя.";

          if(r.includes("Disabler"))
            reason=
              "контроль позволяет ограничить действия противника.";

          if(r.includes("Nuker"))
            reason=
              "burst-урон помогает быстро наказывать уязвимые окна.";

          if(r.includes("Durable"))
            reason=
              "высокая выживаемость позволяет пережить основной урон.";

          if(r.includes("Escape"))
            reason=
              "мобильность помогает избегать опасных ситуаций.";

          return `

            <div class="recommendation">

              <div class="rank">
                #${i+1}
              </div>

              ${imgHTML(item.hero,"rec-img")}

              <div class="rec-info">

                <div class="rec-name">
                  ${item.hero.name}
                </div>

                <div class="reason-box">
                  ${reason}
                </div>

              </div>

              <div class="score">
                ${item.score}
                <small>SCORE</small>
              </div>

            </div>

          `;

        }).join("")}

      </div>

    </div>

  `;
}


/* =====================================================
   START
===================================================== */

renderHeroes();
renderTeam();
renderEnemies();
renderRecommendations();
renderCounterHeroes();
